<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISA Portugal - Mapa Interativo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; font-family:'Segoe UI',sans-serif; background:#1a1a2e; }
  #hd {
    background:linear-gradient(135deg,#16213e,#0f3460);
    color:#fff; padding:10px 20px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  #hd h1 { font-size:18px; font-weight:600; }
  #hd .sub { font-size:11px; opacity:.7; }
  #ctrls { display:flex; align-items:center; gap:10px; }
  #ctrls label { font-size:12px; opacity:.8; }
  #ctrls select {
    padding:6px 10px; border:none; border-radius:4px; font-size:12px;
    min-width:220px; cursor:pointer; background:#1a1a2e; color:#eee;
    border:1px solid #444; outline:none;
  }
  #ctrls select optgroup { background:#1a1a2e; color:#aaa; }
  #ctrls select option { background:#1a1a2e; color:#eee; }
  #mc { position:relative; width:100%; height:calc(100vh - 52px); }
  #map { width:100%; height:100%; }

  /* info panel - top right */
  #info {
    position:absolute; top:12px; right:12px; z-index:1000;
    background:rgba(0,0,0,.75); color:#fff; padding:10px 14px;
    border-radius:6px; font-size:13px; min-width:160px;
    backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.1);
  }
  #info .vn { font-size:11px; color:#8af; margin-bottom:2px; }
  #info .rv { font-size:11px; color:#aaa; }
  #info .hl { color:#ffd700; font-weight:600; }

  /* legend - bottom left */
  #leg {
    position:absolute; bottom:20px; left:12px; z-index:1000;
    background:rgba(0,0,0,.75); color:#fff; padding:8px 12px;
    border-radius:6px; font-size:11px;
    backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.1);
  }
  #leg .lt { font-weight:600; margin-bottom:2px; font-size:11px; }
  #leg .bar { width:160px; height:10px; border-radius:2px; margin:3px 0; }
  #leg .lbl { display:flex; justify-content:space-between; font-size:10px; opacity:.8; }

  /* inset map containers */
  .inset-wrap {
    position:absolute; z-index:999;
    background:rgba(0,0,0,.5); border-radius:6px;
    border:2px solid rgba(255,255,255,.15);
    backdrop-filter:blur(2px);
    overflow:hidden;
  }
  .inset-wrap .ilbl {
    position:absolute; top:4px; left:6px; z-index:1000;
    font-size:10px; font-weight:700; color:#fff;
    text-shadow:0 1px 4px rgba(0,0,0,.8);
    letter-spacing:0.5px;
  }
  .inset-wrap .ival {
    position:absolute; bottom:4px; right:6px; z-index:1000;
    font-size:9px; color:rgba(255,255,255,.7);
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }

  /* permanent region labels */
  .leaflet-tooltip.reg-label {
    background:rgba(0,0,0,.6) !important; color:#fff !important;
    border:1px solid rgba(255,255,255,.2) !important;
    border-radius:3px !important; padding:2px 5px !important;
    font-size:10px !important; font-weight:500 !important;
    box-shadow:none !important; white-space:nowrap !important;
    pointer-events:none !important;
  }
  .leaflet-tooltip.reg-label b { color:#ffd700; }
  .leaflet-tooltip-top.reg-label:before,
  .leaflet-tooltip-bottom.reg-label:before,
  .leaflet-tooltip-left.reg-label:before,
  .leaflet-tooltip-right.reg-label:before { display:none !important; }

  /* hover highlight stays functional */
  .leaflet-interactive { cursor:pointer; }
</style>
</head>
<body>

<div id="hd">
  <div>
    <h1>PISA 2022 &mdash; Portugal</h1>
    <div class="sub">Sub-regioes</div>
  </div>
  <div id="ctrls">
    <label>Variavel:</label>
    <select id="var-select">      <optgroup label="Professor">
        <option value="TC_AGE_MEAN" selected>Idade media prof (anos)</option>
        <option value="TC_EXP_MEAN">Experiencia prof (anos)</option>
        <option value="TC_GENDER_MEAN">Genero prof (1=Fem,2=Masc)</option>
        <option value="TC_PERM_PERC">% profs efetivos</option>
      </optgroup>
      <optgroup label="Background Aluno">
        <option value="ESCS">Indice ESCS</option>
        <option value="HISCED">Educacao pais (nivel 1-10)</option>
        <option value="ICTRES">Recursos ICT casa</option>
        <option value="STU_GENDER">Genero aluno (1=Fem,2=Masc)</option>
        <option value="REPEAT">Repetencia (0=Nao,1=Sim)</option>
      </optgroup>
      <optgroup label="Experiencia Escolar">
        <option value="EXERPRAC">Exercicio (vezes/semana)</option>
        <option value="RELATST">Relacao aluno-prof (WLE)</option>
        <option value="BULLIED">Indice bullying (WLE)</option>
        <option value="FAMSUP">Suporte familiar (WLE)</option>
      </optgroup>
      <optgroup label="Escola">
        <option value="SCHLTYPE">Tipo escola (1=Priv ind,2=Priv dep,3=Pub)</option>
        <option value="SCHSIZE">Dimensao escola (alunos)</option>
        <option value="TOTAT">Total professores</option>
        <option value="PROATCE">% profs certificados</option>
        <option value="STRATIO">Racio alunos/prof</option>
        <option value="STAFFSHORT">Carencia staff (WLE)</option>
        <option value="EDUSHORT">Carencia educacional (WLE)</option>
        <option value="PROBSCRI">Prob recrutamento (WLE)</option>
      </optgroup>
      <optgroup label="COVID-19">
        <option value="CV19_ONLINE_CLASS">Aulas online (escala 1-5)</option>
        <option value="CV19_CANCELLED_CLASS">Aulas canceladas (escala 1-5)</option>
      </optgroup>
      <optgroup label="Matematica">
        <option value="MATH_MEAN">Media Matematica (0-1000)</option>
      </optgroup>
      <optgroup label="Lit. Financeira">
        <option value="FLIT_MEAN">Media Lit. Financeira (0-1000)</option>
      </optgroup>
      <optgroup label="Pens. Criativo">
        <option value="CRTH_MEAN">Media Pens. Criativo (0-60)</option>
      </optgroup>

    </select>
  </div>
</div>

<div id="mc">
  <div id="map"></div>

  <div id="info">
    <div class="vn" id="info-vn">Carregando...</div>
    <div id="info-rv"></div>
  </div>

  <div id="leg">
    <div class="lt">Legenda</div>
    <div class="bar" id="leg-bar"></div>
    <div class="lbl"><span id="leg-min">&ndash;</span><span id="leg-max">&ndash;</span></div>
  </div>

  <div class="inset-wrap" id="wrap-acores" style="bottom:16px;right:12px;width:300px;height:220px;">
    <div class="ilbl">A&ccedil;ores</div>
    <div class="ival" id="ival-acores"></div>
    <div id="map-acores" style="width:100%;height:100%;"></div>
  </div>

  <div class="inset-wrap" id="wrap-madeira" style="bottom:250px;right:12px;width:260px;height:180px;">
    <div class="ilbl">Madeira</div>
    <div class="ival" id="ival-madeira"></div>
    <div id="map-madeira" style="width:100%;height:100%;"></div>
  </div>
</div>

var PV = ["TC_PERM_PERC", "PROATCE"];
var VM = {"STU_GENDER": {"1": "Feminino", "2": "Masculino"}, "SCHLTYPE": {"1": "Priv. independente", "2": "Priv. dependente", "3": "Publica"}, "REPEAT": {"0": "Nao repetiu", "1": "Repetiu"}, "CV19_ONLINE_CLASS": {"1": "Nenhuma", "2": "Menos metade", "3": "Metade", "4": "Mais metade", "5": "Todas"}, "CV19_CANCELLED_CLASS": {"1": "Nenhuma", "2": "Menos metade", "3": "Metade", "4": "Mais metade", "5": "Todas"}};

var map = null, mainLayer = null;
var acMap = null, madMap = null;
var acLayer = null, madLayer = null;
var labelLayer = null;

function hexToRgb(h) {
    h = h.replace('#','');
    return [parseInt(h[0]+h[1],16), parseInt(h[2]+h[3],16), parseInt(h[4]+h[5],16)];
}
function lerp(a,b,t) { return a+(b-a)*t; }
function getColor(val,mn,mx,base) {
    var c = hexToRgb(base);
    if(mx===mn) return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
    var t = (val-mn)/(mx-mn);
    // light = 65% base + 35% white; dark = 70% base + 30% black
    var lr = lerp(255,c[0],.65), lg = lerp(255,c[1],.65), lb = lerp(255,c[2],.65);
    var dr = lerp(c[0],0,.3), dg = lerp(c[1],0,.3), db = lerp(c[2],0,.3);
    var r = lerp(lr,dr,t), g = lerp(lg,dg,t), b = lerp(lb,db,t);
    return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')';
}
function fmtNum(v,k) {
    if(v===null||v===undefined) return 'N/A';
    if(PV.indexOf(k)!==-1) return (v*100).toFixed(v*100===Math.round(v*100)?0:2)+'%';
    if(VM[k]) {
        var ik = Math.round(v);
        if(VM[k][ik]) return ik+' ('+VM[k][ik]+')';
        return v.toFixed(2);
    }
    if(Math.abs(v)>=1000) return v.toFixed(0);
    if(Math.abs(v)>=1) return v.toFixed(2);
    return v.toFixed(4);
}

function roundFmt(v,k) {
    if(v===null||v===undefined) return null;
    if(PV.indexOf(k)!==-1) {
        var p=v*100, s=p===Math.round(p)?p.toFixed(0):p.toFixed(2);
        return parseFloat(s)/100;
    }
    if(VM[k]) return Math.round(v);
    if(Math.abs(v)>=1000) return parseFloat(v.toFixed(0));
    if(Math.abs(v)>=1) return parseFloat(v.toFixed(2));
    return parseFloat(v.toFixed(4));
}

function makeLabelText(stratum,val,k) {
    return '<b>'+stratum+'</b> '+fmtNum(val,k);
}

function updateAll() {
    try {
        var sel = document.getElementById('var-select');
        var k = sel.value, info = VI[k], bc = info.color;
        var vals = {}, all = [];
        for(var reg in SD) {
            var v = SD[reg][k];
            if(v!==null&&v!==undefined) { var rv=roundFmt(v,k); vals[reg]=rv; all.push(rv); }
        }
        if(!all.length) return;
        var mn = Math.min.apply(null,all), mx = Math.max.apply(null,all);

        // legend
        document.getElementById('leg-bar').style.background =
            'linear-gradient(to right,'+getColor(mn,mn,mx,bc)+','+getColor(mx,mn,mx,bc)+')';
        document.getElementById('leg-min').textContent = fmtNum(mn,k);
        document.getElementById('leg-max').textContent = fmtNum(mx,k);
        document.getElementById('info-vn').textContent = info.label;

        function applyStyle(layer) {
            if(!layer.feature) return;
            var name = layer.feature.properties.NUTS_NAME || '';
            var stratum = NM[name] || name;
            var val = vals[stratum];
            layer.setStyle({
                fillColor: val!==undefined ? getColor(val,mn,mx,bc) : '#555',
                fillOpacity: 0.8, color:'#fff', weight:1,
            });
            // update permanent label
            var tt = layer.getTooltip();
            if(tt) tt.setContent(makeLabelText(stratum,val,k));
        }

        if(mainLayer) mainLayer.eachLayer(applyStyle);
        if(acLayer) acLayer.eachLayer(applyStyle);
        if(madLayer) madLayer.eachLayer(applyStyle);

        // update island value labels
        var aV = SD[islandAC] ? SD[islandAC][k] : undefined;
        var mV = SD[islandMD] ? SD[islandMD][k] : undefined;
        document.getElementById('ival-acores').textContent = fmtNum(aV,k);
        document.getElementById('ival-madeira').textContent = fmtNum(mV,k);
    } catch(e) { console.error(e); }
}

function toggleInsets() {
    var b = map.getBounds();
    var ac = L.latLng(38.47, -27.15); // centro dos Açores
    var md = L.latLng(32.75, -16.97); // Funchal
    document.getElementById('wrap-acores').style.display =
        b.contains(ac) ? 'none' : '';
    document.getElementById('wrap-madeira').style.display =
        b.contains(md) ? 'none' : '';
}

var islandAC = 'R.A. Açores';
var islandMD = 'R.A. Madeira';

function initMap() {
    try {
        map = L.map('map', {
            center:[40.5,-7.8], zoom:7.8, zoomControl:true,
            maxBounds: [[30, -36], [44, 0]],
            maxBoundsViscosity: 1.0,
            minZoom: 6
        });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution:'&copy; OSM &copy; CARTO',
            subdomains:'abcd', maxZoom:20
        }).addTo(map);

        var features = PG.features;
        function expandFeatures(fs) {
            var out = [];
            for(var i=0;i<fs.length;i++) {
                var f = fs[i];
                if(f.geometry.type==='MultiPolygon') {
                    var polys = f.geometry.coordinates;
                    var best=0,bestA=0;
                    for(var j=0;j<polys.length;j++) {
                        var c=polys[j][0], mlat=-90,xlat=90,mlng=180,xlng=-180;
                        for(var k=0;k<c.length;k++) {
                            if(c[k][1]>mlat) mlat=c[k][1]; if(c[k][1]<xlat) xlat=c[k][1];
                            if(c[k][0]>xlng) xlng=c[k][0]; if(c[k][0]<mlng) mlng=c[k][0];
                        }
                        var a=(mlat-xlat)*(xlng-mlng);
                        if(a>bestA) { bestA=a; best=j; }
                    }
                    for(var j=0;j<polys.length;j++) {
                        var props = {};
                        for(var p in f.properties) props[p]=f.properties[p];
                        props._mainPoly = j===best;
                        out.push({type:'Feature',properties:props,geometry:{type:'Polygon',coordinates:polys[j]}});
                    }
                } else {
                    out.push(f);
                }
            }
            return out;
        }
        var flatFeatures = expandFeatures(features);
        var mainland=[], acores=[], madeira=[];
        var acoresFull=[], madeiraFull=[];
        for(var i=0;i<features.length;i++) {
            var name = features[i].properties.NUTS_NAME||'', sn = NM[name]||name;
            if(sn===islandAC) acoresFull.push(features[i]);
            else if(sn===islandMD) madeiraFull.push(features[i]);
        }
        for(var i=0;i<flatFeatures.length;i++) {
            var name = flatFeatures[i].properties.NUTS_NAME||'', sn = NM[name]||name;
            if(sn===islandAC) acores.push(flatFeatures[i]);
            else if(sn===islandMD) madeira.push(flatFeatures[i]);
            else mainland.push(flatFeatures[i]);
        }

        function permaLabel(feature,layer) {
            if(feature.properties._mainPoly===false) return;
            var name = feature.properties.NUTS_NAME||'', stratum = NM[name]||name;
            layer.bindTooltip(stratum, { permanent:true, direction:'center', className:'reg-label', offset:[0,0] });
            layer.on('mouseover', function() {
                var k = document.getElementById('var-select').value;
                var val = SD[stratum] ? SD[stratum][k] : undefined;
                document.querySelector('#info-rv').innerHTML =
                    '<span class="hl">'+stratum+'</span>: '+fmtNum(val,k);
                this.setStyle({ weight:2.5, color:'#ffd700' });
            });
            layer.on('mouseout', function() { this.setStyle({ weight:1, color:'#fff' }); });
        }

        var sty = function() { return { fillColor:'#666', fillOpacity:.6, color:'#fff', weight:1 }; };
        var allFeatures = [];
        for(var i=0;i<mainland.length;i++) allFeatures.push(mainland[i]);
        for(var i=0;i<acores.length;i++) allFeatures.push(acores[i]);
        for(var i=0;i<madeira.length;i++) allFeatures.push(madeira[i]);
        mainLayer = L.geoJSON({type:'FeatureCollection',features:allFeatures},
            { style:sty, onEachFeature:permaLabel }).addTo(map);
        map.fitBounds(L.geoJSON({type:'FeatureCollection',features:mainland}).getBounds().pad(0.05));

        // Azores
        if(acoresFull.length) {
            acMap = L.map('map-acores',{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,attributionControl:false});
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(acMap);
            acLayer = L.geoJSON({type:'FeatureCollection',features:acoresFull},{style:sty,onEachFeature:function(f,l){l.bindTooltip('Acores',{permanent:true,direction:'center',className:'reg-label'});}}).addTo(acMap);
            acMap.fitBounds(acLayer.getBounds().pad(0.05));
        }

        // Madeira
        if(madeiraFull.length) {
            madMap = L.map('map-madeira',{zoomControl:false,scrollWheelZoom:false,dragging:false,doubleClickZoom:false,attributionControl:false});
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20}).addTo(madMap);
            madLayer = L.geoJSON({type:'FeatureCollection',features:madeiraFull},{style:sty,onEachFeature:function(f,l){l.bindTooltip('Madeira',{permanent:true,direction:'center',className:'reg-label'});}}).addTo(madMap);
            madMap.fitBounds(madLayer.getBounds().pad(0.05));
        }

        // connect select change event
        document.getElementById('var-select').addEventListener('change', updateAll);

        map.on('moveend', toggleInsets);
        updateAll();
        toggleInsets();
        console.log('Map ready');
    } catch(e) { console.error('initMap err:',e);
        document.getElementById('map').innerHTML='<div style="padding:60px;text-align:center;color:#999;font-size:18px;">Erro: '+e.message+'</div>';
    }
}

document.addEventListener('DOMContentLoaded', initMap);
</script>
